name: Reproduce bounded Spark Lab
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/run_all.py --smoke
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_site.py && python scripts/check_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: sanitized-smoke-evidence
          path: build/smoke-results/
          retention-days: 14
